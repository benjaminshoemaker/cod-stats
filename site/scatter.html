<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Peak vs Longevity · Map Five</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="canonical" href="https://mapfive.app/scatter.html">
<meta name="description" content="Every CoD major winner plotted by peak (best title-winning season) against longevity (distinct titles won), era-adjusted. Measured by winning, not individual stats.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Map Five">
<meta property="og:title" content="Peak vs Longevity · CoD majors">
<meta property="og:description" content="Who won the most in a single season vs who kept winning across the most eras, era-adjusted. Two axes, one chart.">
<meta property="og:url" content="https://mapfive.app/scatter.html">
<meta property="og:image" content="https://mapfive.app/api/og">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://mapfive.app/api/og">
<link rel="stylesheet" href="assets/style.css">
<link rel="preload" href="assets/nav.js" as="script">
<script src="https://browser.sentry-cdn.com/10.62.0/bundle.feedback.min.js"
  integrity="sha384-Osd4ws6GMOft3r45orGjXi52w62BlTXpUzyK7/1Uk4v9xe0hhJD5rFJKDjFpM5Pv" crossorigin="anonymous"></script>
<style>
  .scatter-wrap{position:relative}
  svg.scatter{display:block;width:100%;height:auto;font-family:var(--sans);overflow:visible}
  svg.scatter .grid{stroke:var(--line)}
  svg.scatter .tick{fill:var(--muted);font-size:12px}
  svg.scatter .axlabel{fill:var(--ink);font-size:12px;font-weight:600}
  svg.scatter .dot{fill:var(--accent);fill-opacity:.65;stroke:#fff;stroke-width:1.5}
  svg.scatter .dot.champ{fill:var(--gold)}
  svg.scatter .hit{fill:transparent}
  svg.scatter a{cursor:pointer}
  svg.scatter a:focus-visible{outline:none}
  svg.scatter a:focus-visible .dot,svg.scatter a.selected .dot{stroke:var(--ink);stroke-width:3;fill-opacity:1}
  svg.scatter a.dim{opacity:.2}
  svg.scatter .lbl{fill:var(--ink);font-size:12px;pointer-events:none}
  svg.scatter .count{fill:var(--ink);font-size:10px;font-weight:700;pointer-events:none}
  .scatter-controls{display:flex;flex-wrap:wrap;align-items:end;gap:var(--space-3);margin:var(--space-4) 0}
  .scatter-controls label{display:flex;flex-direction:column;gap:var(--space-1);font-size:var(--text-sm);font-weight:600}
  .scatter-controls button,.scatter-actions button,.scatter-person button{min-height:44px}
  .scatter-search{display:flex;flex-wrap:wrap;gap:var(--space-2)}
  .scatter-search input{min-width:0;flex:1}
  .scatter-panel{border:1px solid var(--line);border-radius:var(--radius);padding:var(--space-4);margin:var(--space-4) 0;scroll-margin-top:calc(var(--navh) + 16px)}
  .scatter-panel h2{margin-top:0}
  .scatter-person{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);padding:var(--space-2) 0;border-top:1px solid var(--line)}
  .scatter-person p{margin:var(--space-1) 0;font-size:var(--text-sm);color:var(--muted)}
  .scatter-person>div{min-width:0}
  .scatter-person button{flex:none;width:auto;min-width:100px}
  .scatter-actions{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-2);margin-top:var(--space-3)}
  .scatter-chip{display:inline-flex;align-items:center;gap:var(--space-1);border:1px solid var(--line);border-radius:24px;padding-left:var(--space-3);background:var(--accent-soft)}
  .scatter-chip button{border:0;background:none;border-radius:50%;min-width:44px;min-height:44px;cursor:pointer}
  #selection-status:empty{display:none}
  @media(max-width:600px){.scatter-controls label{flex:1;min-width:140px}.scatter-controls select{width:100%}.scatter-person{align-items:flex-start}.scatter-panel{padding:var(--space-3)}}
</style>
</head>
<body>
<script src="assets/nav.js"></script>
<main class="wrap" id="root" tabindex="-1"></main>
<script src="data.js"></script>
<script src="assets/app.js"></script>
<script type="module">
import { careerSeasons, careerPeak } from './assets/career.js';
mountPageNav('scatter.html');
const root=document.getElementById('root');
const D=window.APP_DATA;
const byName=Object.fromEntries(D.leaderboard.map(r=>[r.name,r]));
const careers=Object.fromEntries(D.leaderboard.map(r=>[r.name,careerSeasons(D,r.name)]));
const params=new URLSearchParams(location.search);
let longevity=params.get('longevity')==='played'?'played':'won';
let peakMode=params.get('peak')==='three'?'three':'single';
const selected=new Set(params.getAll('p').map(canonicalPlayerName).filter(n=>byName[n]).slice(0,4));
let inspected=[], groups=[], geometry;
const short=g=>window.GAME_ABBR[g] || g;
const pct=v=>`${(v*100).toFixed(1).replace(/\.0$/,'')}%`;
function pointFor(name){
  const r=byName[name], seasons=careers[name], peak=careerPeak(seasons,peakMode==='three'?3:1);
  return {name,peak, x:longevity==='played'?seasons.filter(s=>s.played).length:r.titlesAll,
    adj:r.adjAll,champs:r.champs};
}
function peakText(p){
  if(!p.peak) return 'Fewer than three titles in the recorded career';
  const ss=p.peak.seasons;
  if(ss.length===1){
    const source=D.players[p.name].seasons.find(s=>s.game===ss[0].season);
    return `${pct(p.peak.share)} · ${source.wins}/${source.majors} in ${short(ss[0].season)}`;
  }
  return `${pct(p.peak.share)} average · ${short(ss[0].season)}–${short(ss[2].season)}`;
}
root.innerHTML=`
  <h1>Peak vs. Longevity</h1>
  <p class="lede">Who won big, who kept winning, and who did both? Compare a player's best season with the number of titles they won across. Select a point to see everyone there.</p>
  <div class="scatter-controls">
    <label>Longevity <select id="longevity" class="select" aria-label="Longevity measure"><option value="won">Titles won</option><option value="played">Titles competed in</option></select></label>
    <label>Peak <select id="peak" class="select" aria-label="Peak measure"><option value="single">Best single season</option><option value="three">3-title average</option></select></label>
  </div>
  <form class="scatter-search" id="player-search">
    <input class="search" id="search" list="allplayers" placeholder="Find a player…" aria-label="Find a player" autocomplete="off">
    <datalist id="allplayers">${D.leaderboard.map(r=>`<option value="${esc(r.name)}">`).join('')}</datalist>
    <button class="select" type="submit">Add player</button>
  </form>
  <p class="small muted" id="selection-status" role="status"></p>
  <div id="comparison"></div>
  <div class="legend">
    <span><span class="sw" style="background:var(--gold);border-radius:50%"></span>includes a World Champion</span>
    <span><span class="sw" style="background:var(--accent);border-radius:50%"></span>no World Champion</span>
    <span>Bubble area = adjusted wins of the largest career at that point; a number counts players sharing it.</span>
  </div>
  <div class="scatter-wrap"><div id="chart"></div></div>
  <p class="small muted" id="peak-note"></p>
  <p class="small muted">Upper right = higher peak and more titles. Peak measures major wins, not individual performance. <a href="methodology.html#era-adjustment">How season shares work →</a></p>
  <section id="point-details" class="scatter-panel" aria-labelledby="point-title" hidden></section>`;
const chart=document.getElementById('chart');
const details=document.getElementById('point-details');
const tip=document.createElement('div');tip.className='charttip fixed';document.body.appendChild(tip);
function syncUrl(){
  const url=new URL(location.href);
  url.searchParams.delete('p');selected.forEach(n=>url.searchParams.append('p',n));
  for(const [key,value,base] of [['longevity',longevity,'won'],['peak',peakMode,'single']]){
    if(value===base) url.searchParams.delete(key);else url.searchParams.set(key,value);
  }
  history.replaceState(null,'',url);
}
function renderComparison(){
  const names=[...selected];
  const query=names.map(n=>`p=${encodeURIComponent(n)}`).join('&');
  document.getElementById('comparison').innerHTML=names.length?`<div class="scatter-panel">
    <strong>Highlighted players · ${names.length}/4</strong>
    <div class="scatter-actions">${names.map(n=>`<span class="scatter-chip">${esc(n)}<button type="button" data-remove="${esc(n)}" aria-label="Remove ${esc(n)}">×</button></span>`).join('')}</div>
    ${names.map(n=>{const p=pointFor(n);return `<p class="small"><strong>${esc(n)}</strong> · ${peakText(p)} · ${p.x} titles ${longevity==='played'?'competed in':'won'} · ${p.adj.toFixed(1)} adjusted wins</p>`;}).join('')}
    <div class="scatter-actions">${names.length>=2?`<a href="compare.html?${query}">Compare full résumés →</a>`:''}<a href="trajectory.html?${query}">Compare trajectories →</a></div>
  </div>`:'';
}
function renderDetails(){
  details.hidden=!inspected.length;
  if(!inspected.length) return;
  const players=inspected.map(pointFor);
  details.innerHTML=`<h2 id="point-title" tabindex="-1">${players.length>1?`${players.length} players share this point`:esc(players[0].name)}</h2>
    ${players.map(p=>`<div class="scatter-person"><div><a href="player.html?p=${encodeURIComponent(p.name)}"><strong>${esc(p.name)}</strong></a><p>${peakText(p)} · ${p.x} titles ${longevity==='played'?'competed in':'won'}</p><p>${p.adj.toFixed(1)} adjusted wins · ${p.champs} championship${p.champs===1?'':'s'}</p></div><button type="button" class="select" data-pin="${esc(p.name)}" aria-pressed="${selected.has(p.name)}">${selected.has(p.name)?'Remove':'Highlight'}</button></div>`).join('')}`;
}
function renderChart(){
  tip.classList.remove('on');
  const W=Math.max(280,Math.round(chart.clientWidth)), mobile=W<600, H=mobile?390:520;
  const m={l:46,r:24,t:26,b:58}, pw=W-m.l-m.r, ph=H-m.t-m.b;
  const points=D.leaderboard.map(r=>pointFor(r.name)).filter(p=>p.peak);
  const xMax=Math.max(...points.map(p=>p.x));
  const yMax=Math.min(1,Math.ceil((Math.max(...points.map(p=>p.peak.share))+.04)/.2)*.2);
  const X=x=>m.l+(x-1)/Math.max(1,xMax-1)*pw;
  const Y=y=>m.t+ph-y/yMax*ph;
  const maxAdj=Math.max(...points.map(p=>p.adj));
  const grouped=new Map();
  for(const p of points){const key=`${p.x}|${p.peak.share.toFixed(12)}`;if(!grouped.has(key))grouped.set(key,[]);grouped.get(key).push(p);}
  groups=[...grouped.values()].map(players=>({players,x:X(players[0].x),y:Y(players[0].peak.share)}));
  geometry={W,H};
  let svg='';
  const step=mobile?2:1;
  for(let x=1;x<=xMax;x++){
    if(x!==1 && x!==xMax && x%step!==0) continue;
    svg+=`<line class="grid" x1="${X(x)}" x2="${X(x)}" y1="${m.t}" y2="${m.t+ph}"/><text class="tick" x="${X(x)}" y="${m.t+ph+20}" text-anchor="middle">${x}</text>`;
  }
  for(let y=0;y<=yMax+.001;y+=.2)svg+=`<line class="grid" x1="${m.l}" x2="${W-m.r}" y1="${Y(y)}" y2="${Y(y)}"/><text class="tick" x="${m.l-8}" y="${Y(y)+4}" text-anchor="end">${Math.round(y*100)}%</text>`;
  svg+=`<text class="axlabel" x="${m.l+pw/2}" y="${H-10}" text-anchor="middle">${longevity==='played'?'Titles competed in':'Titles with a major win'} →</text>`;
  svg+=`<text class="axlabel" transform="translate(12,${m.t+ph/2}) rotate(-90)" text-anchor="middle">${peakMode==='three'?'Best 3-title average':'Best season share'} →</text>`;
  const labels=[];
  groups.forEach((g,i)=>{
    const names=g.players.map(p=>p.name), pinned=names.some(n=>selected.has(n));
    const largest=Math.max(...g.players.map(p=>p.adj));
    const radius=Math.sqrt(largest/maxAdj)*15;
    const summary=`${names.join(', ')}: ${pct(g.players[0].peak.share)} peak, ${g.players[0].x} titles. Select for details.`;
    svg+=`<a href="#point-details" role="button" tabindex="0" aria-controls="point-details" data-group="${i}" data-members="${esc(JSON.stringify(names))}" aria-label="${esc(summary)}" class="${pinned?'selected':selected.size?'dim':''}">
      <circle class="dot ${g.players.some(p=>p.champs)?'champ':''}" cx="${g.x}" cy="${g.y}" r="${radius}"/>
      <circle class="hit" cx="${g.x}" cy="${g.y}" r="22"/>
      ${names.length>1?`<text class="count" x="${g.x}" y="${g.y+3}" text-anchor="middle">${names.length}</text>`:''}</a>`;
    const candidate=pinned?names.filter(n=>selected.has(n)).join(' / '):g.players.reduce((a,b)=>a.adj>b.adj?a:b).name;
    labels.push({text:candidate,x:g.x,y:g.y,r:radius,weight:pinned?1000:largest});
  });
  const placed=[];
  for(const l of labels.sort((a,b)=>b.weight-a.weight).slice(0,selected.size?selected.size:mobile?3:8)){
    const left=l.x>W*.65;
    const textWidth=l.text.length*6.4;
    const lx=Math.max(m.l,Math.min(W-m.r-textWidth,left?l.x-l.r-6-textWidth:l.x+l.r+6));
    let ly=l.y-8;
    while(placed.some(q=>Math.abs(q.y-ly)<15 && lx<q.x+q.w && lx+textWidth>q.x))ly+=16;
    ly=Math.max(14,Math.min(H-m.b,ly));placed.push({x:lx,y:ly,w:textWidth});
    svg+=`<text class="lbl" x="${lx}" y="${ly}">${esc(l.text)}</text>`;
  }
  chart.innerHTML=`<svg class="scatter" viewBox="0 0 ${W} ${H}" role="group" aria-label="Peak versus longevity: select a point for player details">${svg}</svg>`;
  document.getElementById('peak-note').textContent=peakMode==='three'
    ? `Peak is the mean share of available majors won across three consecutive game titles, including zero-win titles and gaps within the recorded career. ${D.leaderboard.length-points.length} players with fewer than three titles in their career span are omitted. Each title has equal weight.`
    : 'Peak is the share of available majors won in the best single title. Split-format seasons use winnable majors (for example, 9 in MW19); incomplete seasons use the full schedule.';
}
function render(){
  document.getElementById('longevity').value=longevity;
  document.getElementById('peak').value=peakMode;
  syncUrl();renderComparison();renderChart();renderDetails();
}
function togglePlayer(name){
  const status=document.getElementById('selection-status');status.textContent='';
  if(selected.has(name))selected.delete(name);
  else if(selected.size<4)selected.add(name);
  else {status.textContent='Highlight up to four players. Remove one to add another.';return;}
  render();
}
function inspect(index){
  inspected=groups[index].players.map(p=>p.name);renderDetails();tip.classList.remove('on');
  document.getElementById('point-title').focus({preventScroll:true});
  details.scrollIntoView({block:'nearest',behavior:'instant'});
}
chart.addEventListener('click',e=>{
  const anchor=e.target.closest('[data-group]');if(!anchor)return;e.preventDefault();
  let index=Number(anchor.dataset.group);
  // On a compact chart hit targets can overlap. Pointer input chooses the nearest
  // actual coordinate; keyboard activation always uses its focused group.
  if(e.detail>0){
    const rect=chart.querySelector('svg').getBoundingClientRect();
    const x=(e.clientX-rect.left)*geometry.W/rect.width,y=(e.clientY-rect.top)*geometry.H/rect.height;
    index=groups.reduce((best,g,i)=>Math.hypot(g.x-x,g.y-y)<Math.hypot(groups[best].x-x,groups[best].y-y)?i:best,0);
  }
  inspect(index);
});
chart.addEventListener('keydown',e=>{const a=e.target.closest('[data-group]');if(a && e.key===' '){e.preventDefault();inspect(Number(a.dataset.group));}});
function showTip(anchor){
  tip.textContent=anchor.getAttribute('aria-label');tip.classList.add('on');
  const r=anchor.getBoundingClientRect();
  tip.style.left=Math.max(8,Math.min(innerWidth-tip.offsetWidth-8,r.left))+'px';
  tip.style.top=Math.max(8,r.top-tip.offsetHeight-8)+'px';
}
chart.addEventListener('mouseover',e=>{const a=e.target.closest('[data-group]');if(a)showTip(a);});
chart.addEventListener('focusin',e=>{const a=e.target.closest('[data-group]');if(a)showTip(a);});
for(const event of ['mouseleave','focusout'])chart.addEventListener(event,()=>tip.classList.remove('on'));
document.getElementById('player-search').addEventListener('submit',e=>{
  e.preventDefault();const input=document.getElementById('search');const name=canonicalPlayerName(input.value);
  if(!byName[name]){document.getElementById('selection-status').textContent='Choose a player from the list.';return;}
  if(!selected.has(name))togglePlayer(name);
  input.value='';
});
document.getElementById('comparison').addEventListener('click',e=>{const b=e.target.closest('[data-remove]');if(b)togglePlayer(b.dataset.remove);});
details.addEventListener('click',e=>{const b=e.target.closest('[data-pin]');if(b){const name=b.dataset.pin;togglePlayer(name);[...details.querySelectorAll('[data-pin]')].find(b=>b.dataset.pin===name)?.focus({preventScroll:true});}});
for(const [id,change] of [['longevity',v=>longevity=v],['peak',v=>peakMode=v]])document.getElementById(id).addEventListener('change',e=>{change(e.target.value);inspected=[];render();});
let resizeFrame;
new ResizeObserver(()=>{cancelAnimationFrame(resizeFrame);resizeFrame=requestAnimationFrame(()=>{if(geometry?.W!==Math.max(280,Math.round(chart.clientWidth)))renderChart();});}).observe(chart);
render();mountFoot();
</script>
</body>
</html>
