<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Signatures · Map Five</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="canonical" href="https://mapfive.app/signatures.html">
<meta name="description" content="Player signatures derived from era-adjusted CoD major wins: Champs opportunities, career and peak winning rates, career timing, longevity, and dominant seasons. Recomputed live from the data.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Map Five">
<meta property="og:title" content="Signatures · CoD majors">
<meta property="og:description" content="Career signatures: championship conversion, winning rates, career timing, and dominant seasons. Live from the data.">
<meta property="og:url" content="https://mapfive.app/signatures.html">
<meta property="og:image" content="https://mapfive.app/api/og">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://mapfive.app/api/og">
<link rel="stylesheet" href="assets/style.css">
<link rel="preload" href="assets/nav.js" as="script">
<script src="https://browser.sentry-cdn.com/10.62.0/bundle.feedback.min.js"
  integrity="sha384-Osd4ws6GMOft3r45orGjXi52w62BlTXpUzyK7/1Uk4v9xe0hhJD5rFJKDjFpM5Pv" crossorigin="anonymous"></script>
<style>
  .sig{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:var(--space-4) var(--space-5) var(--space-4);margin:var(--space-4) 0}
  .sig-top{display:flex;align-items:baseline;justify-content:space-between;gap:var(--space-4)}
  .sig h2{font-size:var(--text-lg);margin:0 0 var(--space-1);letter-spacing:-.01em}
  .sig .unit{font-family:var(--mono);font-size:var(--text-xs);letter-spacing:.05em;text-transform:uppercase;
    color:var(--faint);white-space:nowrap}
  .sig .concept{color:var(--muted);font-size:var(--text-base);margin:var(--space-1) 0 var(--space-1);max-width:74ch}
  .sig .howto{color:var(--faint);font-size:var(--text-sm);margin:var(--space-1) 0 var(--space-3);max-width:74ch}
  .sig-pair{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-4) var(--space-6)}
  @media(max-width:640px){.sig-pair{grid-template-columns:1fr;gap:var(--space-2)}}
  .sub-h{font-size:var(--text-xs);font-weight:700;color:var(--ink);margin:var(--space-1) 0 var(--space-1)}
  .sub-h .q{color:var(--faint);font-weight:500}
  .sigrow{display:grid;grid-template-columns:1.2rem minmax(70px,auto) minmax(20px,1fr) auto;align-items:center;
    gap:var(--space-2);padding:var(--space-1) 0;border-top:1px solid var(--line)}
  .sigrow:first-of-type{border-top:0}
  .sigrk{color:var(--faint);font-size:var(--text-xs);text-align:right;font-variant-numeric:tabular-nums}
  .signm{font-weight:600;font-size:var(--text-base);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    color:var(--ink)}
  .signm:hover{color:var(--accent);text-decoration:none}
  .sigbar{background:var(--panel-2);border-radius:5px;height:7px;overflow:hidden}
  .sigfill{display:block;height:100%;background:var(--accent);border-radius:5px}
  .sigfill.alt{background:var(--warn)}
  .sigval{font-size:var(--text-sm);color:var(--ink);white-space:nowrap;text-align:right;
    font-variant-numeric:tabular-nums;font-family:var(--mono)}
  .sigsub{grid-column:2 / -1;color:var(--muted);font-size:var(--text-sm);line-height:1.6;min-width:0}
  .sigrow{padding:var(--space-2) 0;row-gap:2px}
  .sig-top{flex-wrap:wrap;gap:var(--space-1)}
  .sig details{margin-top:var(--space-2)}
  .sig summary{cursor:pointer;color:var(--accent);font-size:var(--text-sm);font-weight:600}
  .sig details ul{padding-left:var(--space-4);font-size:var(--text-sm);color:var(--muted)}
  .rate-control{display:flex;align-items:center;flex-wrap:wrap;gap:var(--space-2);margin:var(--space-3) 0;font-size:var(--text-sm)}
  .rate-control select{max-width:100%;padding:8px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:var(--radius);font:inherit}
  .season-record{border-top:1px solid var(--line);padding:var(--space-3) 0}
  .season-record h3{font-size:var(--text-lg);margin:0 0 var(--space-1)}
  .season-record p{margin:var(--space-1) 0;font-size:var(--text-sm)}
  .season-team{font-weight:600}
  #season-records .season-record{background:var(--accent-soft);padding:var(--space-3);border-radius:var(--radius);margin:var(--space-2) 0}
  @media(max-width:640px){.sig{padding:var(--space-3)}.sig .unit{white-space:normal}}
</style>
</head>
<body>
<script src="assets/nav.js"></script>
<main class="wrap" id="root" tabindex="-1"></main>
<script src="data.js"></script>
<script src="assets/app.js"></script>
<script type="module">
import {careerSeasons, careerPeak} from './assets/career.js';
mountPageNav('signatures.html');
const root=document.getElementById('root');
const LB=D.leaderboard, P=D.players, reference=D.meta.referenceMajors || 10;
const latest=D.meta.seasonOrder.at(-1);
const careersByName=new Map(LB.map(r=>[r.name,careerSeasons(D,r.name)]));
const link=name=>`<a href="player.html?p=${encodeURIComponent(name)}">${esc(name)}</a>`;
const activeCount=name=>careersByName.get(name).filter(s=>s.played).length;
const provisional=name=>careersByName.get(name).some(s=>s.season===latest && s.played);
const round=(v,d=2)=>Number(v.toFixed(d));
function cut(rows,key,n=6){
  const out=rows.slice(0,n);
  if(!out.length) return out;
  for(let i=n;i<rows.length && key(rows[i])===key(out.at(-1));i++) out.push(rows[i]);
  return out;
}
function bars(rows){
  const mx=Math.max(...rows.map(r=>r.bar))||1;
  return rows.map((r,i)=>`<div class="sigrow">
    <span class="sigrk">${rows.findIndex(x=>x.val===r.val)+1}</span>
    <a class="signm" href="player.html?p=${encodeURIComponent(r.name)}">${esc(r.name)}</a>
    <span class="sigbar" aria-hidden="true"><span class="sigfill${r.alt?' alt':''}" style="width:${Math.max(4,r.bar/mx*100).toFixed(0)}%"></span></span>
    <span class="sigval"><strong class="sigvalue">${r.val}</strong></span>
    <div class="sigsub">${r.sub || ''}${r.context?`<div class="champs-context" data-player="${esc(r.name)}">Loading Champs results…</div>`:''}</div>
  </div>`).join('');
}
function frontload(r){
  const wins=P[r.name].seasons.flatMap(s=>s.events.map(e=>e.date));
  if(wins.length<4 || !r.firstPlayedDate || !r.lastPlayedDate) return null;
  const first=Date.parse(r.firstPlayedDate), span=Date.parse(r.lastPlayedDate)-first;
  if(span<=0) return null;
  return {name:r.name,v:wins.reduce((sum,d)=>sum+Math.max(0,Math.min(1,(Date.parse(d)-first)/span)),0)/wins.length,
    range:`${r.firstPlayed}–${r.lastPlayed} · ${wins.length} wins${provisional(r.name)?' · latest-title participant; provisional':''}`};
}
const merchants=cut(LB.filter(r=>r.champs>=2).map(r=>({...r,rate:r.champs/r.adjAll}))
  .sort((a,b)=>b.rate-a.rate),r=>round(r.rate)).map(r=>({name:r.name,bar:r.rate,val:r.rate.toFixed(2),
    sub:`${r.champs} rings / ${r.adjAll.toFixed(1)} adjusted wins`,context:true}));
const uncrowned=cut(LB.filter(r=>r.champs===0).sort((a,b)=>b.adjAll-a.adjAll),r=>round(r.adjAll,1))
  .map(r=>({name:r.name,bar:r.adjAll,val:r.adjAll.toFixed(1),sub:`adjusted wins · ${r.raw} raw wins`,alt:true,context:true}));
const timing=LB.map(frontload).filter(Boolean);
const timingRows=late=>cut([...timing].sort((a,b)=>late?b.v-a.v:a.v-b.v),r=>round(r.v),5)
  .map(r=>({name:r.name,bar:Math.abs(r.v-.5),val:r.v.toFixed(2),sub:r.range,alt:late}));
const careers=cut([...LB].sort((a,b)=>b.careerSpan-a.careerSpan),r=>r.careerSpan,7).map(r=>{
  const seasons=careersByName.get(r.name), active=activeCount(r.name), gaps=seasons.length-active;
  return {name:r.name,bar:r.careerSpan,val:`${r.careerSpan}y`,
    sub:`${r.firstPlayed}–${r.lastPlayed} · ${active} active seasons · ${gaps} ${gaps===1?'title':'titles'} without recorded participation`};
});

// Group identical winning event sets AND teams, so one shared team result is
// not presented as four independent feats. A changed roster remains separate.
const groups=new Map();
for(const r of LB) for(const s of P[r.name].seasons){
  const key=JSON.stringify([s.game,s.events.map(e=>[e.eventId || e.event,e.team]).sort((a,b)=>JSON.stringify(a).localeCompare(JSON.stringify(b)))]);
  if(!groups.has(key)) groups.set(key,{...s,names:[],share:s.wins/s.majors});
  groups.get(key).names.push(r.name);
}
const seasons=[...groups.values()].sort((a,b)=>b.share-a.share || D.meta.seasonOrder.indexOf(a.game)-D.meta.seasonOrder.indexOf(b.game));
const record=seasons[0]?.share || 0;
function seasonCard(s){
  const teams=[...new Set(s.events.map(e=>e.team).filter(Boolean))];
  const inProgress=D.games.find(g=>g.game===s.game)?.majors<s.majors;
  return `<article class="season-record">
    <h3>${s.wins} of ${s.majors} majors won · ${Math.round(s.share*100)}%</h3>
    <p><a href="game.html?g=${encodeURIComponent(s.game)}">${esc(s.game)}</a> · ${(s.share*reference).toFixed(2)} adjusted wins${inProgress?' · season in progress':''}</p>
    <p class="season-team">${teams.map(esc).join(' / ') || 'Team not recorded'}</p>
    <p>${s.names.map(link).join(', ')}</p>
    <details><summary>Winning events</summary><ul>${s.events.map(e=>`<li>${esc(e.date)} · ${esc(e.event)} · ${esc(e.team || 'Team not recorded')}</li>`).join('')}</ul></details>
  </article>`;
}
root.innerHTML=`
  <h1>Signatures</h1>
  <p class="lede">Different ways to read a winning career: championship opportunities, sustained and peak winning rates,
  when the wins came, and how long the player competed. Each board uses the same major results as the leaderboard.</p>
  <section class="sig" id="rings" aria-labelledby="rings-title">
    <div class="sig-top"><h2 id="rings-title">Ring merchants &amp; the uncrowned</h2><span class="unit">index · adjusted wins</span></div>
    <p class="concept">The crown-heavy index divides rings by adjusted wins. It combines two different units, so it is an index, not a percentage of wins.</p>
    <p class="howto">Left: at least two rings. Right: the most adjusted wins without a ring. Recorded Champs appearances show how many opportunities each player had; conversion is championships won ÷ appearances.</p>
    <p id="champs-status" class="howto" role="status">Loading Champs opportunities…</p>
    <div class="sig-pair">
      <div><h3 class="sub-h">Most crown-heavy <span class="q">· rings ÷ adjusted wins</span></h3><div id="merchants">${bars(merchants)}</div></div>
      <div><h3 class="sub-h">The uncrowned <span class="q">· adjusted wins, zero rings</span></h3><div id="uncrowned">${bars(uncrowned)}</div></div>
    </div>
  </section>
  <section class="sig" id="density" aria-labelledby="density-title">
    <div class="sig-top"><h2 id="density-title">Compressed dominance</h2><span class="unit" id="density-unit"></span></div>
    <p class="concept">Compare winning over a whole career with a player's strongest stretch.</p>
    <label class="rate-control">Winning rate <select id="density-mode">
      <option value="active">Career: per active season</option>
      <option value="peak">Peak: best three consecutive titles</option>
      <option value="elapsed">Career: per elapsed year</option>
    </select></label>
    <p class="howto" id="density-note"></p>
    <div id="density-rows" aria-live="polite"></div>
  </section>
  <section class="sig" id="timing" aria-labelledby="timing-title">
    <div class="sig-top"><h2 id="timing-title">Early-winning / late-winning careers</h2><span class="unit">career-timing index</span></div>
    <p class="concept">Average the position of each win between the first recorded major appearance (0) and the most recent (1).
    Below 0.5 means wins fell earlier in that observed career; above 0.5 means later.</p>
    <p class="howto">Minimum four wins. This measures win timing, not age, talent, or development. Players with recorded participation in ${esc(latest)} are marked provisional:
    more appearances can move this index even without another win. Absence from the latest title does not confirm retirement.</p>
    <div class="sig-pair"><div><h3 class="sub-h">Earlier wins</h3>${bars(timingRows(false))}</div>
    <div><h3 class="sub-h">Later wins</h3>${bars(timingRows(true))}</div></div>
  </section>
  <section class="sig" id="careers" aria-labelledby="careers-title">
    <div class="sig-top"><h2 id="careers-title">The long careers</h2><span class="unit">calendar-year span</span></div>
    <p class="concept">The year of a player's most recent recorded major minus the year of their first. Active seasons count titles with at least one recorded appearance, including winless titles.</p>
    <p class="howto">Gaps are titles between those appearances with no recorded participation. They may reflect a break or missing coverage. Equal displayed spans share a rank.</p>
    <div id="career-rows">${bars(careers)}</div>
  </section>
  <section class="sig" id="peaks" aria-labelledby="peaks-title">
    <div class="sig-top"><h2 id="peaks-title">The most dominant seasons on record</h2><span class="unit">share of majors won</span></div>
    <p class="concept">Wins out of the season's scoring denominator, followed by the percentage and adjusted value (share × ${reference}).</p>
    <p class="howto">Players with identical winning events and teams are grouped together. The teams shown are where those wins happened;
    open the events for roster context. Top ten result groups, extended through ties; future scheduled majors remain in the denominator for an in-progress season.</p>
    <div id="season-records">${seasons.filter(s=>s.share===record).map(seasonCard).join('')}</div>
    <details id="more-seasons"><summary>More top seasons</summary>${cut(seasons,s=>s.share,10).filter(s=>s.share<record).map(seasonCard).join('')}</details>
  </section>`;

const mode=document.getElementById('density-mode');
const params=new URLSearchParams(location.search);
mode.value=['active','peak','elapsed'].includes(params.get('rate'))?params.get('rate'):'active';
function renderDensity(){
  const kind=mode.value;
  let rows=LB.filter(r=>r.adjAll>=4).map(r=>{
    const active=activeCount(r.name), span=careersByName.get(r.name);
    if(kind==='peak'){
      const peak=careerPeak(span,3);
      return peak?{name:r.name,rate:peak.share*reference,sub:`${esc(peak.seasons[0].season)}–${esc(peak.seasons.at(-1).season)} · 3 consecutive titles`}:null;
    }
    const years=(Date.parse(r.lastPlayedDate)-Date.parse(r.firstPlayedDate))/(86400000*365.2425);
    const denom=kind==='active'?active:years;
    return denom>=2?{name:r.name,rate:r.adjAll/denom,
      sub:`${r.adjAll.toFixed(1)} adjusted wins / ${kind==='active'?active+' active seasons':years.toFixed(2)+' elapsed years'}`}:null;
  }).filter(Boolean).sort((a,b)=>b.rate-a.rate);
  rows=cut(rows,r=>round(r.rate));
  document.getElementById('density-rows').innerHTML=bars(rows.map(r=>({...r,bar:r.rate,val:r.rate.toFixed(2)})));
  document.getElementById('density-unit').textContent=kind==='elapsed'?'adjusted wins / year':'adjusted wins / season';
  document.getElementById('density-note').textContent={
    active:'Career adjusted wins ÷ titles with recorded participation, including zero-win titles. Titles without recorded participation are excluded; partial seasons count as one active season. Minimum four adjusted wins and two active seasons.',
    peak:'Highest average adjusted wins across three consecutive titles within the observed career. Includes zero-win titles and gaps as zero; each title has equal weight. Minimum four career adjusted wins and a three-title span.',
    elapsed:'Career adjusted wins ÷ exact elapsed time between first and most recent major appearances (365.2425 days per year). Gaps count toward the denominator. Minimum four adjusted wins and two elapsed years.'
  }[kind];
}
mode.addEventListener('change',()=>{
  const url=new URL(location.href);url.searchParams.set('rate',mode.value);history.replaceState(null,'',url);renderDensity();
});
renderDensity();
mountFoot();

// Championship finals only: qualifiers and other events with "Championship"
// in their names are not opportunities to win a world championship.
const isChamps=event=>/^Call of Duty (?:World League |League )?Championship 20\d\d$/.test(event);
async function loadChamps(){
  const status=document.getElementById('champs-status');
  try{
    const response=await fetch('participation.json');
    if(!response.ok) throw new Error('Champs results unavailable');
    const participation=await response.json();
    document.querySelectorAll('.champs-context').forEach(el=>{
      const name=el.dataset.player;
      const events=(participation[name] || []).filter(e=>isChamps(e.event) && e.date<=D.meta.asOf)
        .sort((a,b)=>a.date.localeCompare(b.date));
      const wins=events.filter(e=>e.won).length;
      const placed=events.filter(e=>Number.isFinite(e.placeX2)).sort((a,b)=>a.placeX2-b.placeX2);
      el.innerHTML=events.length?`${events.length} Champs appearances · ${Math.round(wins/events.length*100)}% won · best finish: ${esc(placed[0]?.place || 'unrecorded')}
        <details><summary>Champs results</summary>${TableSurface.dataTable({label:`${name} Champs results`,caption:`Recorded championship appearances for ${name}`,head:'<tr><th>Championship</th><th>Team</th><th>Finish</th></tr>',
          rows:events.map(e=>`<tr><td>${esc(e.event)}</td><td>${esc(e.team || 'Unrecorded')}</td><td>${esc(e.place || 'Unrecorded')}</td></tr>`).join('')})}</details>`:'No recorded Champs appearances; conversion unavailable';
    });
    status.textContent=`Champs finals only, through ${D.meta.asOf}. Opportunities are recorded appearances; qualifying events are excluded.`;
  }catch{
    document.querySelectorAll('.champs-context').forEach(el=>{el.textContent='Champs opportunities unavailable';});
    status.innerHTML='Champs results unavailable. <button type="button" id="retry-champs">Retry</button>';
    document.getElementById('retry-champs').addEventListener('click',loadChamps);
  }
}
loadChamps();
</script>
</body>
</html>
