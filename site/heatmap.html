<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dominance heatmap · Map Five</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="canonical" href="https://mapfive.app/heatmap.html">
<meta name="description" content="Every top CoD player's share of each title's majors, as a heatmap. See who owned which era. Gold marks a World Championship season.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Map Five">
<meta property="og:title" content="Dominance heatmap · CoD majors by era">
<meta property="og:description" content="Each player's share of every title's majors. See who owned which era. Gold marks a World Championship win.">
<meta property="og:url" content="https://mapfive.app/heatmap.html">
<meta property="og:image" content="https://mapfive.app/api/og">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://mapfive.app/api/og">
<link rel="stylesheet" href="assets/style.css">
<link rel="preload" href="assets/nav.js" as="script">
<script src="https://browser.sentry-cdn.com/10.62.0/bundle.feedback.min.js"
  integrity="sha384-Osd4ws6GMOft3r45orGjXi52w62BlTXpUzyK7/1Uk4v9xe0hhJD5rFJKDjFpM5Pv" crossorigin="anonymous"></script>
<style>
  /* sequential ramp endpoints — read by the cell colorer AND the legend gradient,
     so retuning the ramp can't desync them */
  :root{--seq0:#eaf1fe;--seq1:#1e3a8a}
  .chart-wrap{overflow-x:auto;position:relative}
  /* min-width matches the viewBox width so in-SVG text never renders below authored size */
  svg.hm{display:block;min-width:948px;width:100%;height:auto;font-family:var(--sans)}
  svg.hm .col{fill:var(--muted);font-size:9.5px}
  svg.hm .row{fill:var(--ink);font-size:12px}
  svg.hm a{cursor:pointer}
  svg.hm a:hover .row{text-decoration:underline;fill:var(--accent)}
  svg.hm .cell{cursor:pointer}
  svg.hm .cell:focus-visible,svg.hm .cell[aria-expanded="true"]{outline:none;stroke:var(--ink);stroke-width:2}
  .season-results{margin-top:var(--space-5);padding:var(--space-4);border:1px solid var(--line);border-radius:var(--radius);scroll-margin-top:calc(var(--navh) + 16px)}
  .season-results h2{margin-top:0}
  .season-results button{min-height:44px}
  .season-results .data{min-width:640px}
  .season-results .data td:first-child{white-space:nowrap}
  .hm-zero,.hm-absent{display:inline-block;width:14px;height:14px;border:1px solid var(--line-2);vertical-align:middle;margin-right:4px}
  .hm-zero{background:var(--seq0)}
  .hm-absent{background:repeating-linear-gradient(135deg,#fff,#fff 3px,#e2e8f0 3px,#e2e8f0 4px)}
  svg.hm .pct{font-size:9.5px;pointer-events:none}
  .swatches{display:flex;align-items:center;gap:var(--space-2);font-size:var(--text-sm);color:var(--muted);margin:var(--space-1) 0 var(--space-1)}
  .swatches .ramp{display:inline-block;width:120px;height:12px;border-radius:3px;
    background:linear-gradient(90deg,var(--seq0),var(--seq1))}
</style>
</head>
<body>
<script src="assets/nav.js"></script>
<main class="wrap wide" id="root" tabindex="-1"></main>
<script src="data.js"></script>
<script src="assets/app.js"></script>
<script type="module">
import { eraContext, computeRows } from './assets/rank.js';
import { careerSeasons } from './assets/career.js';
mountPageNav('heatmap.html');
const D = window.APP_DATA;
// design tokens: championship gold + the sequential ramp (single source of truth)
const css = getComputedStyle(document.documentElement);
const GOLD = css.getPropertyValue('--gold').trim();
const GOLD_INK = css.getPropertyValue('--gold-ink').trim();
const SEQ0 = css.getPropertyValue('--seq0').trim(), SEQ1 = css.getPropertyValue('--seq1').trim();
const { PRESETS } = eraContext(D);
const ORDER = D.meta.seasonOrder;
const GAMES = Object.fromEntries(D.games.map(g=>[g.game,g]));
const ABBR = Object.fromEntries(ORDER.map(g=>[g, window.GAME_ABBR[g]||g]));

// event -> season (shared, from app.js), so a World-Championship win marks the right cell
const event2game = window.EVENT2GAME;

const seq=t=>mixHex(SEQ0,SEQ1,Math.max(0,Math.min(1,t)));

const rows = computeRows(D, new Set(PRESETS.all), 1).sort((a,b)=>a.adjRank-b.adjRank).slice(0,16);
const seasonOf = {}, champGames = {}, careers = {};
for(const r of rows){
  const p = D.players[r.name];
  careers[r.name] = new Map(careerSeasons(D, r.name).map(s => [s.season, s]));
  seasonOf[r.name] = Object.fromEntries(p.seasons.map(s=>[s.game,s]));
  champGames[r.name] = new Set((p.champ_events||[]).map(c=>event2game[c.event]).filter(Boolean));
}
// A fixed 0–100% scale keeps the same season share the same color in every view.

const cw=44, rh=28, x0=140, y0=64, W=x0+cw*ORDER.length+16, H=y0+rh*rows.length+14;
let s=`<svg class="hm" viewBox="0 0 ${W} ${H}" role="group" aria-label="Dominance heatmap of the top 16 players by era-adjusted wins. Select a cell for season results. Hatched cells mean no recorded participation; pale blue means played without a win. Gold dots mark World Championship seasons.">`;
s+='<defs><pattern id="no-participation" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#fff"/><path d="M0 6L6 0" stroke="#e2e8f0" stroke-width="1"/></pattern></defs>';
ORDER.forEach((g,j)=>{const x=x0+j*cw+cw/2;
  s+=`<text class="col" x="${x}" y="${y0-8}" transform="rotate(-45 ${x} ${y0-8})" text-anchor="start">${esc(ABBR[g])}</text>`;});
rows.forEach((r,i)=>{
  const y=y0+i*rh; const nm=r.name;
  s+=`<a href="player.html?p=${encodeURIComponent(nm)}"><text class="row" x="${x0-8}" y="${y+rh/2+4}" text-anchor="end">${esc(nm)}</text></a>`;
  ORDER.forEach((g,j)=>{
    const season=seasonOf[nm][g], v=season ? season.wins/season.majors : 0, x=x0+j*cw, isChamp=champGames[nm].has(g);
    const played=Boolean(careers[nm].get(g)?.played);
    const state=v>0?'wins':played?'zero':'absent';
    const wins=season?.wins||0, majors=season?.majors||GAMES[g].denom;
    const fill=played ? seq(v) : 'url(#no-participation)';
    const tip=v>0?`${nm}, ${ABBR[g]}: ${wins}/${majors} majors (${Math.round(v*100)}%)${isChamp?' · World Champion':''}`:`${nm}, ${ABBR[g]}: ${played?'played, zero wins':'no recorded major participation'}`;
    s+=`<rect class="cell" tabindex="0" focusable="true" role="button" data-player="${esc(nm)}" data-game="${esc(g)}" data-state="${state}" aria-controls="season-results" aria-label="${esc(tip)}" x="${x+1}" y="${y+1}" width="${cw-2}" height="${rh-2}" rx="4" fill="${fill}" data-tip="${esc(tip)}"></rect>`;
    if(v>=0.30 || (isChamp && v>0)){
      // flip to white only where white actually reaches AA on the interpolated ramp (~t 0.62)
      const dark=v>0.62; s+=`<text class="pct" x="${x+cw/2}" y="${y+rh/2+4}" text-anchor="middle" fill="${dark?'#fff':'var(--ink)'}">${Math.round(v*100)}</text>`;
    }
    if(isChamp) s+=`<circle cx="${x+cw-6}" cy="${y+6}" r="3.4" fill="${GOLD}" stroke="#fff" stroke-width="1" pointer-events="none"><title>${esc(nm)} won the ${ABBR[g]} World Championship</title></circle>`;
  });
});
s+='</svg>';

// keyboard/AT (and touch) alternative: the same numbers as an HTML table
let tbl = `<thead><tr><th scope="col">Player</th>${ORDER.map(g=>`<th scope="col" class="n">${esc(ABBR[g])}</th>`).join('')}</tr></thead><tbody>`;
for(const r of rows){
  tbl += `<tr><th scope="row"><a href="player.html?p=${encodeURIComponent(r.name)}">${esc(r.name)}</a></th>`;
  for(const g of ORDER){
    const season=seasonOf[r.name][g], v=season?.share||0, isChamp=champGames[r.name].has(g);
    const played=Boolean(careers[r.name].get(g)?.played);
    tbl += `<td class="n"><button class="link-button" data-player="${esc(r.name)}" data-game="${esc(g)}" aria-label="${esc(r.name)}, ${esc(g)} results">${v>0?`${season.wins}/${season.majors}${isChamp?' ◆':''}`:played?'0 wins':'No record'}</button></td>`;
  }
  tbl += '</tr>';
}
tbl += '</tbody>';

document.getElementById('root').innerHTML = `
  <h1>Dominance heatmap</h1>
  <p class="lede">Each cell is a player's <strong>share of that title's majors</strong>, the same season-share the leaderboard is built on.
  Darker = more of the season won. A <span style="color:${GOLD_INK}">◆ gold dot</span> marks a season they won the World Championship.
  Read a row for a career, a column for who owned that title. <a href="methodology.html#era-adjustment">How adjusted wins work →</a></p>
  <div class="swatches"><span>0%</span><span class="ramp"></span><span>100% of a season won · fixed scale</span></div>
  <p class="small muted"><span class="hm-zero"></span>Played, zero wins &nbsp; <span class="hm-absent"></span>No recorded major participation</p>
  <p class="scrollhint small faint">Swipe the chart sideways →</p>
  <div class="chart-wrap">${s}</div>
  <p class="small muted">Top 16 by era-adjusted wins (all seasons). Select a cell for the player’s season results.</p>
  <section id="season-results" class="season-results" aria-labelledby="season-result-title" hidden></section>
  <details class="sim-method"><summary>View as a table (wins / majors, ◆ = World Championship season)</summary>
    ${TableSurface.dataTable({
      label: 'Dominance heatmap table alternative',
      caption: 'Dominance heatmap table alternative',
      wrapperClass: 'heatmap-table-wrap',
      tableClass: 'data',
      html: tbl
    })}</details>`;

// styled HTML tooltip: instant, works on tap, and replaces the slow native <title>
const wrapEl = document.querySelector('.chart-wrap');
const tipEl = document.createElement('div');
tipEl.className = 'charttip'; wrapEl.appendChild(tipEl);
function showCellTip(c){
  tipEl.textContent = c.dataset.tip; tipEl.classList.add('on');
  const wr = wrapEl.getBoundingClientRect(), cr = c.getBoundingClientRect();
  let x = cr.left - wr.left + wrapEl.scrollLeft + cr.width/2 - tipEl.offsetWidth/2;
  x = Math.max(4, Math.min(x, wrapEl.scrollWidth - tipEl.offsetWidth - 4));
  let y = cr.top - wr.top - tipEl.offsetHeight - 8;
  if(y < 0) y = cr.bottom - wr.top + 8;
  tipEl.style.left = x+'px'; tipEl.style.top = y+'px';
}
wrapEl.addEventListener('mouseover', e=>{
  const c = e.target.closest('rect.cell');
  if(!c || !c.dataset.tip){ tipEl.classList.remove('on'); return; }
  showCellTip(c);
});
wrapEl.addEventListener('focusin', e=>{
  const c = e.target.closest('rect.cell');
  if(c && c.dataset.tip) showCellTip(c);
});
wrapEl.addEventListener('focusout', e=>{
  if(e.target.closest('rect.cell')) tipEl.classList.remove('on');
});
wrapEl.addEventListener('mouseleave', ()=>tipEl.classList.remove('on'));
let participationRequest;
let selectionId=0;
const results=document.getElementById('season-results');
async function openSeason(name, game){
  const id=++selectionId;
  document.querySelectorAll('rect.cell').forEach(c=>c.setAttribute('aria-expanded',String(c.dataset.player===name && c.dataset.game===game)));
  const record=careers[name]?.get(game);
  const season=seasonOf[name]?.[game];
  const wins=season?.wins || 0, denom=season?.majors || GAMES[game].denom;
  results.hidden=false;
  results.innerHTML=`<h2 id="season-result-title" tabindex="-1">${esc(name)} · ${esc(game)}</h2>
    <p>${wins} of ${denom} available majors won${record?.played ? ` · ${record.events} entered` : ''}.</p>
    <div id="season-result-body">${record?.played ? '<p role="status">Loading season results…</p>' : '<p>No recorded major participation for this player in this title. This does not establish that they were inactive.</p>'}</div>
    <p><a href="player.html?p=${encodeURIComponent(name)}&majors=all#major-wins">Full player record →</a> · <a href="game.html?g=${encodeURIComponent(game)}">Season overview →</a></p>
    <button type="button" class="select" id="close-season">Close results</button>`;
  document.getElementById('season-result-title').focus({preventScroll:true});
  results.scrollIntoView({block:'nearest',behavior:'instant'});
  document.getElementById('close-season').onclick=()=>{
    selectionId++; results.hidden=true;
    const cell=[...document.querySelectorAll('rect.cell')].find(c=>c.dataset.player===name && c.dataset.game===game);
    cell?.setAttribute('aria-expanded','false');
    cell?.focus();
  };
  if(!record?.played) return;
  try{
    participationRequest ||= fetch('participation.json').then(r=>{
      if(!r.ok) throw new Error('Participation unavailable');
      return r.json();
    }).catch(error=>{participationRequest=null;throw error;});
    const all=await participationRequest;
    if(id!==selectionId) return;
    const events=(all[name] || []).filter(e=>e.game===game).sort((a,b)=>a.date.localeCompare(b.date));
    // Winning records can be present even when detailed participation is sparse.
    const seen=new Set(events.map(e=>e.eventId || e.event));
    for(const e of season?.events || []) if(!seen.has(e.eventId || e.event)) events.push({...e,won:true,place:'1'});
    events.sort((a,b)=>a.date.localeCompare(b.date));
    document.getElementById('season-result-body').innerHTML=events.length ? TableSurface.dataTable({
      label:`${name} ${game} major results`,caption:`Recorded major results for ${name} in ${game}`,
      tableClass:'data',head:'<thead><tr><th scope="col">Date</th><th scope="col">Event</th><th scope="col">Team</th><th scope="col">Finish</th></tr></thead>',
      rows:events.map(e=>`<tr><td class="num">${esc(e.date)}</td><td>${esc(e.event)}</td><td>${teamBadge(e.team)}</td><td>${e.won?'1st':esc(e.place || 'Unknown')}</td></tr>`).join('')
    }) : '<p>Participation is recorded in the season summary, but event details are unavailable.</p>';
  }catch(error){
    if(id===selectionId) document.getElementById('season-result-body').innerHTML='<p role="status">Could not load season results. Select the cell again to retry.</p>';
  }
}
document.getElementById('root').addEventListener('click',e=>{
  const cell=e.target.closest('[data-player][data-game]');
  if(cell) openSeason(cell.dataset.player,cell.dataset.game);
});
wrapEl.addEventListener('keydown',e=>{
  const cell=e.target.closest('rect.cell');
  if(cell && (e.key==='Enter' || e.key===' ')){
    e.preventDefault();openSeason(cell.dataset.player,cell.dataset.game);
  }
});
mountFoot();
</script>
</body>
</html>
